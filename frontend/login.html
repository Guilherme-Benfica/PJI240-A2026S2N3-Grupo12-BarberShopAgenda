<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BarberShop Agenda — Entrar</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a href="#conteudo-principal" class="pular-para-conteudo">Pular para o conteúdo principal</a>

  <header class="cabecalho">
    <a href="agendar.html" class="logo" aria-label="BarberShop Agenda, página inicial">Barber<span>Shop</span> Agenda</a>
  </header>

  <main id="conteudo-principal" class="main-estreita">
    <h1>Entrar</h1>
    <p class="texto-suave">Barbeiro, administrador ou cliente com conta. Se você é cliente e ainda não tem conta, <a href="agendar.html">agende seu horário aqui</a> ou <a href="criar-conta.html">crie uma conta</a>.</p>
    <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

    <section class="cartao" aria-labelledby="titulo-login">
      <h2 id="titulo-login">Login</h2>
      <form id="form-login" novalidate>
        <div class="campo">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" name="email" required aria-required="true" autocomplete="username" />
        </div>
        <div class="campo">
          <label for="login-senha">Senha</label>
          <input type="password" id="login-senha" name="senha" required aria-required="true" autocomplete="current-password" />
        </div>
        <div class="acoes-tabela">
          <button type="submit" class="botao-primario">Entrar</button>
        </div>
      </form>
      <p class="texto-suave texto-ajuda"><a href="esqueci-senha.html">Esqueci minha senha</a></p>
    </section>
  </main>

  <footer class="rodape">BarberShop Agenda &mdash; sistema de agendamento para barbearias</footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
